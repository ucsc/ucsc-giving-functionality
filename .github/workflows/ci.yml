# Continuous integration — runs on every pull request.
#
# release.yml only fires on v*.*.* tags, so before this workflow nothing
# validated a pull request. Runs PHPCS for style and PHPUnit for behaviour.
#
# The PHPUnit suite is unit-level: tests/bootstrap.php stubs WordPress, so no
# WordPress install, database, ACF Pro licence or ucsc-2022 theme is needed
# here. See issue #129 for why full integration testing is out of scope.
#
# The package job guards the distributable. `plugin-zip` is the only thing used
# from @wordpress/scripts, so a dependency bump that breaks it would otherwise
# only surface when a release tag is pushed.

name: CI

on:
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: read

# A new push to the same ref makes the in-flight run redundant.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    checks:
        name: PHP ${{ matrix.php-version }}
        runs-on: ubuntu-latest

        strategy:
            # Report every failing version, not just the first.
            fail-fast: false
            matrix:
                # 8.1 is the declared floor and what ucsc/wp-dev.ucsc pins.
                # 8.4 is the forward-compatibility check.
                php-version: ['8.1', '8.4']

        steps:
            - name: Checkout code
              uses: actions/checkout@v6.0.2

            - name: Set up PHP
              uses: shivammathur/setup-php@2.37.2
              with:
                  php-version: ${{ matrix.php-version }}
                  extensions: mbstring
                  coverage: none
                  tools: composer

            - name: Install Composer dependencies
              run: composer install --no-progress --no-interaction

            - name: Run PHPCS
              run: composer lint

            - name: Run PHPUnit
              run: composer test

    package:
        name: Build ZIP
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v6.0.2

            - name: Set up Node.js
              uses: actions/setup-node@v6.4.0
              with:
                  # Matches the default in the shared ucsc/actions release
                  # workflow, so this builds the ZIP the same way a release does.
                  node-version: '24'
                  cache: 'npm'

            # `npm ci` rather than `npm install`: it also fails if
            # package-lock.json has drifted out of sync with package.json.
            - name: Install Node dependencies
              run: npm ci

            - name: Build the distributable ZIP
              run: npm run zip

            - name: Verify ZIP contents
              run: |
                  set -euo pipefail
                  zip='ucsc-giving-functionality-plugin.zip'
                  root='ucsc-giving-functionality-plugin'

                  if [ ! -f "$zip" ]; then
                      echo "::error::$zip was not produced"
                      exit 1
                  fi

                  entries="$(unzip -Z1 "$zip" | sort)"
                  echo "$entries"

                  fail=0

                  # Everything the `files` array in package.json promises to
                  # ship, plus package.json itself — npm-packlist always
                  # includes that regardless of `files`, so it is expected.
                  for path in plugin.php README.md CHANGELOG.md LICENSE package.json; do
                      if ! printf '%s\n' "$entries" | grep -qxF "$root/$path"; then
                          echo "::error::ZIP is missing $path"
                          fail=1
                      fi
                  done

                  for dir in acf-json lib; do
                      if ! printf '%s\n' "$entries" | grep -q "^$root/$dir/"; then
                          echo "::error::ZIP is missing $dir/"
                          fail=1
                      fi
                  done

                  # Nothing here may ever ship to a WordPress site.
                  forbidden="^$root/(tests/|node_modules/|vendor/|\.github/|phpunit\.xml\.dist$|composer\.(json|lock)$|package-lock\.json$)"
                  if printf '%s\n' "$entries" | grep -Eq "$forbidden"; then
                      echo "::error::ZIP contains files that must not ship:"
                      printf '%s\n' "$entries" | grep -E "$forbidden"
                      fail=1
                  fi

                  exit "$fail"
