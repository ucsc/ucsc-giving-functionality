# Continuous integration — runs on every pull request.
#
# release.yml only fires on v*.*.* tags, so before this workflow nothing
# validated a pull request. Runs PHPCS for style and PHPUnit for behaviour.
#
# The PHPUnit suite is unit-level: tests/bootstrap.php stubs WordPress, so no
# WordPress install, database, ACF Pro licence or ucsc-2022 theme is needed
# here. See issue #129 for why full integration testing is out of scope.

name: CI

on:
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: read

# A new push to the same ref makes the in-flight run redundant.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    checks:
        name: PHP ${{ matrix.php-version }}
        runs-on: ubuntu-latest

        strategy:
            # Report every failing version, not just the first.
            fail-fast: false
            matrix:
                # 8.1 is the declared floor and what ucsc/wp-dev.ucsc pins.
                # 8.4 is the forward-compatibility check.
                php-version: ['8.1', '8.4']

        steps:
            - name: Checkout code
              uses: actions/checkout@v6.0.2

            - name: Set up PHP
              uses: shivammathur/setup-php@2.37.2
              with:
                  php-version: ${{ matrix.php-version }}
                  extensions: mbstring
                  coverage: none
                  tools: composer

            - name: Install Composer dependencies
              run: composer install --no-progress --no-interaction

            - name: Run PHPCS
              run: composer lint

            - name: Run PHPUnit
              run: composer test
